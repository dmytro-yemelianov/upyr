name: Self-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: self-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Evidence-backed self-audit (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned measurement toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, llvm-tools-preview
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: self-audit
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev
      - name: Install pinned audit tools
        run: |
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.8 --locked
      - name: Measure and validate
        run: python3 tools/run_self_audit.py
      - name: Publish job summary
        if: always()
        run: |
          if test -f target/self-audit/report.md; then
            cat target/self-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Self-audit unavailable: setup or measurement did not finish. See job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-audit-${{ github.sha }}
          path: target/self-audit/
          if-no-files-found: warn
          retention-days: 90
