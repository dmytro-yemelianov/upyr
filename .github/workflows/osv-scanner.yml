name: OSV-Scanner

# Cross-ecosystem CVE scan (Rust, GitHub Actions, and any JS in the tree)
# against the OSV.dev database. Complements the RustSec advisory audit in
# security.yml, which is Rust-only. Scan pull requests as well as main so
# dependency or policy changes are checked before merging.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: OSV scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --format=table
            --output-file=osv-scan-report.txt
            ./

      - name: Surface findings in job summary
        if: always()
        run: |
          {
            echo "## OSV-Scanner findings"
            echo
            echo '```'
            cat osv-scan-report.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scan-report
          path: osv-scan-report.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on findings
        if: steps.osv.outcome != 'success'
        run: |
          echo "::error::OSV-Scanner found vulnerabilities or failed — see job summary"
          exit 1
