name: Dependency licenses

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licenses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Cargo license and source policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned policy checker
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: Check dependency metadata against deny.toml
        run: |
          set -o pipefail
          cargo deny --workspace --all-features --locked check licenses sources 2>&1 | tee dependency-licenses.log
      - name: Preserve policy results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-licenses-${{ github.sha }}
          path: dependency-licenses.log
          if-no-files-found: warn
          retention-days: 90
